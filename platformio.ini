[platformio]
src_dir = esp32_marauder
test_dir = test

[env:c3_supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitc-02
framework = arduino
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_deps = 
  h2zero/NimBLE-Arduino@^1.3.8
  adafruit/Adafruit NeoPixel@^1.12.0
build_flags = 
  -D MARAUDER_C3_SUPERMINI
  -D HAS_NIMBLE_2
  -D HAS_IDF_3
  -D HAS_BT
  -D HAS_NEOPIXEL_LED

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = true
extra_scripts =
  pre:tools/native_coverage.py
build_src_filter =
  -<*>
  +<MarauderMacAddress.cpp>
  +<PcapHeader.cpp>
  +<Switches.cpp>
  +<DisplayLine.cpp>
  +<BeaconFrame.cpp>
  +<WdgResponse.cpp>
  +<FoxHuntTarget.cpp>
  +<TargetListSort.cpp>
  +<TDongleStats.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
  --coverage
  -Itest/support
